- name: Setup simulated web environment
  hosts: local
  become: yes
    #become: no
  vars:
    web_root: /tmp/my_website
    packages:
      - nginx
      - git

  tasks:
    - name: Install required packages
      apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes

    - name: Create website directory structure
      file:
        path: "{{ web_root }}"
        state: directory
        mode: '0755'

    - name: Deploy templated HTML file
      template:
        src: templates/index.html.j2
        dest: "{{ web_root }}/index.html"
      notify: Restart nginx

    - name: Configure NGINX to serve from /tmp/my_website
      copy:
        dest: /etc/nginx/sites-available/my_website
        content: |
          server {
              listen 8080;
              server_name localhost;
              root {{ web_root }};
              index index.html;
          }
      notify: Restart nginx

    - name: Enable site by linking to sites-enabled
      file:
        src: /etc/nginx/sites-available/my_website
        dest: /etc/nginx/sites-enabled/my_website
        state: link
        force: yes
      notify: Restart nginx

    - name: Remove default nginx site if exists
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted

