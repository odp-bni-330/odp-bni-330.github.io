- name: Deploy Backend Microservices to ECS
  hosts: backend
  become: yes
  vars:
    ecs_cluster_name: ecommerce-cluster
    services:
      - name: recommendation
        image: myrepo/recommendation:latest
      - name: users
        image: myrepo/users:latest
      - name: orders
        image: myrepo/orders:latest
      - name: cart
        image: myrepo/cart:latest
      - name: products
        image: myrepo/products:latest
      - name: search
        image: myrepo/search:latest
  tasks:
    - name: Generate ECS Task Definitions from template
      ansible.builtin.template:
        src: templates/task_definition.json.j2
        dest: "/tmp/{{ item.name }}-taskdef.json"
      loop: "{{ services }}"

    - name: Register ECS Task Definitions
      community.aws.ecs_taskdefinition:
        family: "{{ item.name }}"
        task_role_arn: null
        execution_role_arn: null
        network_mode: awsvpc
        requires_compatibilities: ["FARGATE"]
        cpu: 256
        memory: 512
        container_definitions: "{{ lookup('file', '/tmp/' + item.name + '-taskdef.json') }}"
        state: present
      loop: "{{ services }}"

    - name: Deploy ECS Services using template
      ansible.builtin.template:
        src: templates/ecs_service.yml.j2
        dest: "/tmp/{{ item.name }}-ecs-service.yml"
      loop: "{{ services }}"

